<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmación de compra</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f7f7f7; padding: 20px;">
  <table style="max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px;">
    <tr>
      <td style="text-align: center;">
        <h2 style="color: #4CAF50;">¡Gracias por tu compra, {{nombre}}! 🎉</h2>
        <p style="color: #333;">Estos son los detalles de tu pedido:</p>
      </td>
    </tr>
    <tr>
      <td>
        <table width="100%" style="border-collapse: collapse; margin-top: 15px;">
          <thead>
            <tr style="background: #4CAF50; color: white;">
              <th style="padding: 10px;">Libro</th>
              <th style="padding: 10px;">Cantidad</th>
              <th style="padding: 10px;">Precio</th>
              <th style="padding: 10px;">Total</th>
            </tr>
          </thead>
          <tbody>
            {{listaLibros}}
          </tbody>
        </table>
        <p style="text-align: right; margin-top: 20px; font-size: 18px;">
          <strong>Total: ${{total}}</strong>
        </p>
      </td>
    </tr>
    <tr>
      <td style="text-align: center; padding-top: 20px;">
        <p style="color: #777;">Gracias por comprar en <strong>Verne Learning</strong> 📚</p>
      </td>
    </tr>
  </table>
</body>
</html>
